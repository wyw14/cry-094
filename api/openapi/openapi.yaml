openapi: 3.0.3
info:
  title: ScriptScope API
  version: 1.0.0
  description: Offline static dependency analysis and controlled precheck planning.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      responses:
        '200': {description: Short-lived access token and revocable refresh token}
        '401': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      operationId: rotateRefreshToken
      security: []
      responses:
        '200': {description: Rotated token pair}
        '401': {$ref: '#/components/responses/Error'}
  /teams:
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeam'}
      responses:
        '201': {description: Team created}
        '400': {$ref: '#/components/responses/Error'}
  /libraries:
    post:
      operationId: createLibrary
      responses:
        '201': {description: Library created}
        '403': {$ref: '#/components/responses/Error'}
  /artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - {in: query, name: library_id, required: true, schema: {type: string}}
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: sort, schema: {type: string, enum: [uploaded_at, number]}}
      responses:
        '200': {description: Cursor page}
    post:
      operationId: uploadArtifact
      description: Stores an immutable script version without executing or sourcing it.
      responses:
        '201': {description: Artifact stored}
        '400': {$ref: '#/components/responses/Error'}
  /artifacts/{id}/content:
    get:
      operationId: downloadArtifact
      description: Authorizes by team ownership and streams content without exposing storage paths.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: team_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Original normalized script bytes}
        '403': {$ref: '#/components/responses/Error'}
  /analyses:
    post:
      operationId: analyzeLibrary
      description: Builds a digest-bound dependency graph and blocking evidence chain.
      responses:
        '200': {description: Static analysis completed}
        '409': {$ref: '#/components/responses/Error'}
  /precheck-plans:
    post:
      operationId: generatePrecheckPlan
      description: Generates read-only capability checks and never installs software.
      responses:
        '201': {description: Draft generated}
  /precheck-plans/{id}/submit:
    post:
      operationId: submitPrecheckPlan
      parameters: [{$ref: '#/components/parameters/PlanID'}]
      responses: {'204': {description: Submitted}}
  /precheck-plans/{id}/review:
    post:
      operationId: reviewPrecheckPlan
      parameters: [{$ref: '#/components/parameters/PlanID'}]
      responses: {'204': {description: Reviewed}}
  /precheck-plans/{id}/sign:
    post:
      operationId: signPrecheckPlan
      parameters: [{$ref: '#/components/parameters/PlanID'}]
      responses: {'204': {description: Signed version created}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    PlanID: {in: path, name: id, required: true, schema: {type: string}}
  schemas:
    CreateTeam:
      type: object
      required: [name, owner_id]
      properties:
        name: {type: string, minLength: 3}
        owner_id: {type: string}
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    Error:
      type: object
      required: [code, message, fields, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        fields: {type: array, items: {$ref: '#/components/schemas/FieldError'}}
        request_id: {type: string}
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {$ref: '#/components/schemas/Error'}
security:
  - bearerAuth: []
