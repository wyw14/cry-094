services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scriptscope
      POSTGRES_USER: scriptscope
      POSTGRES_PASSWORD: scriptscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptscope"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - scriptscope_pg:/var/lib/postgresql/data
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://scriptscope:scriptscope@postgres:5432/scriptscope?sslmode=disable
      SIGNING_SECRET: local-compose-signing-secret
      AUTH_SECRET: local-compose-auth-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
volumes:
  scriptscope_pg:
